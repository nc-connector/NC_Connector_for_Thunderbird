<!doctype html>
<meta charset="utf-8">
<title data-i18n="connection_required_title">Nextcloud is not connected</title>
<link rel="stylesheet" href="tbTheme.css">
<style>
:root{
  --brand-blue:var(--tb-accent);
  --control-height:32px;
  --control-radius:var(--tb-control-radius);
}
html,
body{
  min-width:420px;
  height:100%;
}
body{
  margin:0;
  padding:0;
  font:message-box;
  background:var(--tb-bg);
  color:var(--tb-text);
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
.dialog{
  width:100%;
  max-width:480px;
  min-height:100%;
  border:1px solid var(--tb-border);
  border-radius:var(--tb-radius);
  background:var(--tb-bg);
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
body.native-popup{width:420px;height:auto;}
.native-popup .dialog{min-height:0;border:0;}
[hidden]{display:none !important;}
.content{
  padding:16px 18px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
h1{
  margin:0;
  font-size:16px;
}
.message{
  margin:0;
  color:var(--tb-text);
  line-height:1.4;
  white-space:pre-line;
  overflow-wrap:anywhere;
}
.message.is-error{color:var(--tb-error);}
.notice-row{display:flex;gap:12px;align-items:flex-start;}
.notice-row svg{width:24px;height:24px;flex:none;color:var(--tb-error);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.status{
  min-height:16px;
  margin:0;
  color:var(--tb-error);
  font-size:12px;
}
.status:empty{
  display:none;
}
.actions{
  margin-top:auto;
  border-top:1px solid var(--tb-border);
  padding:12px 18px;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}
button{
  height:var(--control-height);
  padding:0 14px;
  border:1px solid var(--tb-border);
  border-radius:var(--control-radius);
  background:var(--tb-surface);
  color:var(--tb-text);
  cursor:pointer;
}
button.primary{
  background:var(--brand-blue);
  border-color:var(--brand-blue);
  color:#fff;
}
button:disabled{
  opacity:.55;
  cursor:not-allowed;
}
</style>
<body>
  <div class="dialog">
    <div class="nc-brand-header">
      <img src="assets/header-solid-blue-328x96.png" alt="NC Connector">
    </div>
    <div class="content">
      <h1 id="connectionRequiredTitle" data-i18n="connection_required_title">Nextcloud is not connected</h1>
      <div class="notice-row">
        <svg id="accessNoticeIcon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M12 3L2 21h20zM12 9v5M12 18h.01"/></svg>
        <p class="message" id="connectionRequiredMessage" role="alert"></p>
      </div>
      <p class="status" id="connectionRequiredStatus" role="alert"></p>
    </div>
    <div class="actions">
      <button type="button" id="closeBtn" data-i18n="open_url_close">Close</button>
      <button type="button" class="primary" id="openSettingsBtn" data-i18n="connection_required_open_settings">Open settings</button>
    </div>
  </div>
  <script src="../modules/logContext.js"></script>
  <script src="domI18n.js"></script>
  <script src="connectionRequired.js"></script>
</body>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="vfs_setup_title">Nextcloud access</title>
  <link rel="stylesheet" href="tbTheme.css">
  <style>
    html,body{margin:0;min-height:100%;background:var(--tb-bg);color:var(--tb-text);font:message-box;}
    body{box-sizing:border-box;padding:18px;}
    main{display:grid;gap:16px;max-width:480px;margin:0 auto;}
    .hero{display:flex;align-items:center;justify-content:center;min-height:74px;border-radius:10px;background:#0082c9;}
    .hero img{width:164px;height:48px;object-fit:contain;}
    h1{margin:0;font-size:20px;}
    p{margin:0;line-height:1.45;}
    .access-card{border:1px solid var(--tb-border);border-radius:10px;padding:14px;background:var(--tb-surface);}
    .access-card ul{margin:10px 0 0;padding-left:22px;display:grid;gap:6px;}
    .status{min-height:20px;font-size:13px;color:var(--tb-muted);}
    .status.error{color:var(--tb-error,#c50022);}
    .actions{display:flex;justify-content:flex-end;gap:10px;}
    button{min-height:36px;padding:0 16px;border:1px solid var(--tb-border);border-radius:6px;background:var(--tb-surface);color:var(--tb-text);font:inherit;cursor:pointer;}
    button.primary{border-color:#0082c9;background:#0082c9;color:#fff;}
    button:disabled{opacity:.5;cursor:not-allowed;}
  </style>
</head>
<body>
  <main>
    <div class="hero"><img src="assets/header-solid-blue-328x96.png" alt="NC Connector"></div>
    <h1 data-i18n="vfs_setup_heading">Allow Nextcloud access?</h1>
    <p id="requestText"></p>
    <p id="accountText"></p>
    <section class="access-card">
      <strong data-i18n="vfs_setup_access_heading">Read and write access</strong>
      <ul>
        <li data-i18n="vfs_setup_access_read">Browse and read files and folders</li>
        <li data-i18n="vfs_setup_access_write">Create and modify files and folders</li>
        <li data-i18n="vfs_setup_access_delete">Delete files and folders</li>
      </ul>
    </section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="actions">
      <button type="button" id="cancel" data-i18n="sharing_button_cancel">Cancel</button>
      <button type="button" class="primary" id="grant" data-i18n="vfs_setup_allow">Allow access</button>
    </div>
  </main>
  <script src="../modules/logContext.js"></script>
  <script src="../modules/i18n.js"></script>
  <script src="domI18n.js"></script>
  <script src="vfsProviderSetup.js"></script>
</body>
</html>
